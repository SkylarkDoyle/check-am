greenbook:
  verified_on: "2026-11-21"
  url: "https://greenbook.nafdac.gov.ng"
  endpoint: "https://greenbook.nafdac.gov.ng"
  mode: "xhr"
  total_records: 9048
  columns:
    product_name: "product_name"
    nafdac_reg_num: "NAFDAC"
    ingredient: "ingredient.ingredient_name"
    applicant: "applicant.name"
    category: "product_category.name"
    approval_date: "approval_date"
    expiry_date: "expiry_date"
    status: "status"
  # Greenbook exposes no OTC flag by name, but marketing_category_id separates the classes:
  # 2 = non-prescription (paracetamol, ibuprofen, antacids, loperamide, vitamins, ...),
  # 1 = prescription-only (amoxicillin, tramadol, statins, ARVs ...), 5 = medical devices.
  # Verified empirically on all 9,048 records on 2026-11-21 (id->label mapping is inferred).
  otc_marketing_category_ids: [2]
  otc_category_names: ["Drugs", "Herbals and Nutraceuticals"]
  excluded_routes: ["intravenous", "intramuscular", "subcutaneous", "parenteral", "intrathecal"]


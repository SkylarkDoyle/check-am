[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "checkam-etl"
version = "0.1.0"
description = "CheckAm NAFDAC registry and alerts ETL pipeline"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "httpx",
    "playwright",
    "pdfplumber",
    "tenacity",
    "beautifulsoup4",
    "pyyaml"
]

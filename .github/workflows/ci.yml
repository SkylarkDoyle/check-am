# Checks that run on every pull request and every push to main. Nothing here touches production:
# the ETL tests use a throwaway Postgres container that is deleted when the job ends.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "logo-assets/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm exec vite build

  etl-tests:
    name: ETL tests (throwaway Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: checkam
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: checkam
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U checkam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://checkam:ci-only-password@localhost:5432/checkam
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/pyproject.toml

      - name: Install
        run: |
          pip install -e ./etl pytest pytest-asyncio

      - name: Create the tables
        working-directory: db
        run: alembic upgrade head

      - name: Tests
        run: python -m pytest etl/tests -q

# Refreshes the production registry data (Neon) on a schedule, or on demand from the Actions tab.
# It does NOT run on pushes: the registry changes on its own timetable, not with our code.
#
# One-time setup (GitHub: Settings > Secrets and variables > Actions > New repository secret):
#   NEON_DIRECT_URL     the Neon DIRECT connection string (host without "-pooler"), as used by
#                       `--target neon`. Never commit it.
#   ALERT_WEBHOOK_URL   optional. If set, a failed run posts a short message to this URL.
#
# Schedules (UTC):
#   daily   05:00  the public alerts PDF (alerts change fastest)
#   weekly  Sun 03:00  the registry (food_db, greenbook)
# Manual: "Run workflow", then pick a source. image_enrich is slow and manual only.
name: ETL (refresh registry data)

on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      source:
        description: "What to run"
        type: choice
        default: alerts_pdf
        options:
          - alerts_pdf
          - food_db
          - greenbook
          - registry (food_db and greenbook)
          - image_enrich
      limit:
        description: "Only the first N rows (leave empty for all). Handy for a first test."
        required: false
      prune:
        description: "Delete rows the portal no longer lists (food_db and greenbook only)"
        type: boolean
        default: false

# Never run two refreshes at the same time against the same database.
concurrency:
  group: etl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEON_DIRECT_URL: ${{ secrets.NEON_DIRECT_URL }}
      ETL_CONTACT_EMAIL: ${{ vars.ETL_CONTACT_EMAIL || 'dev@checkam.com.ng' }}
      ETL_USER_AGENT: "CheckAmETL/0.1 (+mailto:${{ vars.ETL_CONTACT_EMAIL || 'dev@checkam.com.ng' }})"
      ETL_RAW_CACHE_DIR: ${{ github.workspace }}/raw_cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/pyproject.toml

      - name: Install
        run: |
          pip install -e ./etl

      # Downloaded pages are reused between runs, so a repeat run asks the portals for less.
      - name: Restore the raw page cache
        uses: actions/cache@v4
        with:
          path: raw_cache
          key: etl-raw-cache-${{ github.run_id }}
          restore-keys: etl-raw-cache-

      - name: Work out what to run
        id: plan
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 3 * * 0" ]; then
              echo "sources=food_db greenbook" >> "$GITHUB_OUTPUT"
            else
              echo "sources=alerts_pdf" >> "$GITHUB_OUTPUT"
            fi
          else
            case "${{ inputs.source }}" in
              "registry (food_db and greenbook)") echo "sources=food_db greenbook" >> "$GITHUB_OUTPUT" ;;
              *) echo "sources=${{ inputs.source }}" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Make sure the database target is set
        run: |
          if [ -z "${NEON_DIRECT_URL}" ]; then
            echo "::error::The NEON_DIRECT_URL secret is not set. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Run
        env:
          LIMIT: ${{ inputs.limit }}
          PRUNE: ${{ inputs.prune }}
        run: |
          set -uo pipefail
          status=0
          for src in ${{ steps.plan.outputs.sources }}; do
            args=(run --source "$src" --target neon)
            [ -n "${LIMIT:-}" ] && args+=(--limit "$LIMIT")
            # Pruning only ever happens when someone asks for it by hand.
            if [ "${PRUNE:-false}" = "true" ] && { [ "$src" = "food_db" ] || [ "$src" = "greenbook" ]; }; then
              args+=(--prune)
            fi
            echo "::group::$src"
            python -m checkam_etl.cli "${args[@]}" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Keep the run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etl-logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Tell us it failed
        if: failure()
        env:
          WEBHOOK: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -n "${WEBHOOK:-}" ]; then
            curl -sS -X POST -H "Content-Type: application/json" \
              -d "{\"text\":\"CheckAm ETL failed: ${{ steps.plan.outputs.sources }} (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\"}" \
              "$WEBHOOK" || true
          fi

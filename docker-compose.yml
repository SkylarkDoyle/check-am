services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: checkam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: checkam
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkam"]
      interval: 5s
      retries: 10
volumes:
  pgdata:

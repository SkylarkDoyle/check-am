# CheckAm local stack.
#   docker compose up --build            -> db + migrations + api (:8000) + web (:8080)
#   docker compose run --rm etl run --source food_db          (fill the local db)
#   docker compose run --rm etl run --source food_db --target neon   (needs NEON_DIRECT_URL)
# Compose reads secrets from the root .env (gitignored). Production uses Neon + FastAPI Cloud;
# this file is for local development and a self-hosted fallback.
name: checkam

x-local-db-url: &local-db-url postgresql://checkam:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/checkam

services:
  db:
    image: postgres:18-alpine # matches Neon (Postgres 18)
    environment:
      POSTGRES_USER: checkam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: checkam
    # Host port 5433 so it never clashes with a native Postgres on 5432.
    ports: ["127.0.0.1:${DB_PORT:-5433}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql # Postgres 18 images keep a versioned dir under here
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkam -d checkam"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: etl/Dockerfile
    image: checkam-etl:latest
    working_dir: /app/db
    entrypoint: ["alembic", "upgrade", "head"]
    command: []
    environment:
      DATABASE_URL: postgresql+psycopg://checkam:${POSTGRES_PASSWORD}@db:5432/checkam
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    image: checkam-api:latest
    environment:
      DATABASE_URL: *local-db-url
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080","http://localhost:5173"]'
      DB_POOL_MIN: ${DB_POOL_MIN:-1}
      DB_POOL_MAX: ${DB_POOL_MAX:-5}
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    image: checkam-web:latest
    ports: ["127.0.0.1:${WEB_PORT:-8080}:8080"]
    depends_on:
      - api
    restart: unless-stopped

  # On demand only (profile "etl"): `docker compose run --rm etl run --source food_db`
  etl:
    profiles: ["etl"]
    image: checkam-etl:latest
    environment:
      DATABASE_URL: postgresql+psycopg://checkam:${POSTGRES_PASSWORD}@db:5432/checkam
      # Empty by default so a plain run can never touch production; --target neon needs it.
      NEON_DIRECT_URL: ${NEON_DIRECT_URL:-}
      ETL_CONTACT_EMAIL: ${ETL_CONTACT_EMAIL:-dev@checkam.ng}
      ETL_MIN_DELAY_SECONDS: ${ETL_MIN_DELAY_SECONDS:-2}
    volumes:
      - etl_data:/data # raw_cache + run logs survive between runs
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  pgdata:
  etl_data:

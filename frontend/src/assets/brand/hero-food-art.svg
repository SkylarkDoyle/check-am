<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 166 134" width="143" height="116" role="img" aria-labelledby="hfa-t" stroke="#1D2A1A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
  <title id="hfa-t">Cereal box, tinned tomato and juice carton</title>

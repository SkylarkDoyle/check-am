    <path d="M12 32h68" fill="none"/>
    <circle cx="46" cy="68" r="20" fill="#FFF8DC" stroke-width="2.5"/>
    <path d="M30 74a17 17 0 0 1 32 0z" fill="#F2A33A" stroke-width="2.5"/>
